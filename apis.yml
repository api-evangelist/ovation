aid: ovation
name: Ovation
description: >-
  Ovation is an AI-first guest experience and feedback platform for restaurants,
  founded by Zack Oates and voted the #1 guest feedback platform in a
  RestaurantOwner.com survey. It uses a frictionless, SMS-based two-question
  survey to capture real-time guest sentiment on- and off-premise, then applies
  AI to categorize feedback across 35+ restaurant-specific topics, surface
  operational insights, generate guest-recovery responses, manage online
  reviews, and run text marketing campaigns. Ovation connects to 50+ POS, online
  ordering, and loyalty systems, including Olo, to source guest interactions.
  These are pre-built partner integrations. Ovation does operate an API — its
  Summer 2025 release announced API User Management, "easily create, edit, and
  remove users via API", and the API host api.ovationup.com is live — but no
  public API reference, OpenAPI definition, developer portal, or SDK is
  published anywhere, and anonymous calls to that host are refused. Where
  integration is technical it
  is inbound and partner-driven: for example, Ovation receives Olo webhook events
  (OrderPlaced, OrderClosed, OrderCancelled, GuestOptIn, UserOptOut, and similar)
  authenticated with a shared secret, and the connection is configured directly
  through the partner's customer success and developer teams rather than via a
  self-serve Ovation API. Integration access is arranged directly with the
  company.
