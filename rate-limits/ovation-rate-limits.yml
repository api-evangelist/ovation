detail: >-
  Ovation has no developer portal, no API reference, and no published API terms, so
  there is nowhere a limit could be documented. The only anonymously reachable endpoint
  on the API host — https://api.ovationup.com/ping, HTTP 200, body "healthy" — returns
  no RateLimit-*, X-RateLimit-* or Retry-After header. Every other path on that host
  answers 403 before any rate-limit header could be emitted, so no runtime signal can
  be observed without credentials. Nothing was inferred from the AWS API Gateway
  platform default: a platform capability is not a published provider limit.
